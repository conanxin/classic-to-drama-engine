$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:ctde:schema:portable-public-key-status-registry:1"
title: "CTDE Portable Public Key Status Registry V1"
type: object
additionalProperties: false
required:
  - schema_version
  - artifact_class
  - assurance_profile_id
  - trust_domain
  - canonicalization_id
  - material_path
  - material_sha256
  - keys
$defs:
  kid:
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$"
  sha256:
    type: string
    pattern: "^[0-9a-f]{64}$"
  rfc3339_utc:
    type: string
    pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
properties:
  schema_version: {const: "1.0.0"}
  artifact_class: {const: "ctde_portable_public_key_status_registry"}
  assurance_profile_id: {const: "CTDE-PORTABLE-DEV-1"}
  trust_domain: {const: "ctde-portable-runtime"}
  canonicalization_id: {const: "CTDE-PUBLIC-TRUST-JCS-1"}
  material_path: {const: "portable_public_trust_material_v1.json"}
  material_sha256: {$ref: "#/$defs/sha256"}
  keys:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [kid, jws_alg, key_algorithm, status, trust_domain, not_before, expires_at]
      properties:
        kid: {$ref: "#/$defs/kid"}
        jws_alg: {const: "EdDSA"}
        key_algorithm: {const: "Ed25519"}
        status: {enum: [active, revoked, expired, disabled]}
        trust_domain: {const: "ctde-portable-runtime"}
        not_before: {$ref: "#/$defs/rfc3339_utc"}
        expires_at: {$ref: "#/$defs/rfc3339_utc"}
