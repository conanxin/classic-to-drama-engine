name: Deploy CTDE web archive

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
      - 'WEB_PUBLICATION_CHECKPOINT.md'
      - 'WEB_PUBLICATION_FINAL_RESULT.md'
      - 'scripts/odyssey_m1_v2/**'
      - 'editorial/odyssey_m1_v2/**'
      - 'production/odyssey_m1_v2/**'
      - 'preproduction/odyssey_m1_p3/**'
      - 'visual-development/odyssey_m1_p4/**'
      - 'storyboards/odyssey_m1_p4/**'
      - 'design/odyssey_m1_p4/**'
      - 'previs/odyssey_m1_p4/**'
      - 'art-department/odyssey_m1_p5/**'
      - 'animatic/odyssey_m1_p5/**'
      - 'pitch/odyssey_m1_p5/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install
        working-directory: site
        run: npm ci
      - name: Verify and build
        working-directory: site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
