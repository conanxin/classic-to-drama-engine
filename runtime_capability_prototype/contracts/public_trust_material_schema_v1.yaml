$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:ctde:schema:portable-public-trust-material:1"
title: "CTDE Portable Public Trust Material V1"
type: object
additionalProperties: false
required:
  - schema_version
  - artifact_class
  - assurance_profile_id
  - trust_domain
  - canonicalization_id
  - keys
$defs:
  kid:
    type: string
    pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$"
  sha256:
    type: string
    pattern: "^[0-9a-f]{64}$"
properties:
  schema_version: {const: "1.0.0"}
  artifact_class: {const: "ctde_portable_public_trust_material"}
  assurance_profile_id: {const: "CTDE-PORTABLE-DEV-1"}
  trust_domain: {const: "ctde-portable-runtime"}
  canonicalization_id: {const: "CTDE-PUBLIC-TRUST-JCS-1"}
  keys:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [kid, jws_alg, key_algorithm, public_key_encoding, public_key_hex, public_key_bytes_sha256]
      properties:
        kid: {$ref: "#/$defs/kid"}
        jws_alg: {const: "EdDSA"}
        key_algorithm: {const: "Ed25519"}
        public_key_encoding: {const: "raw-32-byte-lowercase-hex"}
        public_key_hex: {type: string, pattern: "^[0-9a-f]{64}$"}
        public_key_bytes_sha256: {$ref: "#/$defs/sha256"}
