schema_version: "1.0.0"
artifact_class: "runtime_capability_test_policy"
environment: "prototype_fixture_only"
suite_namespace: "RCPTS-*"
attempt_namespace: "RCPT-*"
candidate_run_ids_allowed: false
candidate_run_authorized: false
formal_phase_2_input: false
production_source_binding_allowed: false
source_inputs:
  allow:
    - "ephemeral synthetic fixture objects generated by fixture_factory.py"
  deny:
    - "project source tree"
    - "Odyssey English TEI"
    - "Greek TEI"
    - "book_structure_map.yaml"
runtime:
  range:
    start_byte: 4076
    end_byte_exclusive: 36515
    expected_length: 32439
  automatic_retry_count: 0
  model_invocations: 0
  payload_persistence_allowed: false
  sandbox_backend: "empty chroot+single uid/gid namespace map+zero capabilities+no_new_privs+seccomp+close_fds+/proc supervisor"
  scope_proof_level: "candidate_visible_bytes_and_application_exact_range"
signed_profiles:
  algorithm: "EdDSA"
  protected_profile_version: 1
  capability_ttl_seconds_max: 60
  envelope_ttl_seconds_max: 60
  attestation_ttl_seconds_max: 300
  deterministic_clock_skew_seconds: 0
suite_acceptance:
  manifest_runner_counts_must_match: true
  skipped_allowed: 0
  unknown_allowed: 0
  failed_allowed: 0
  evidence_missing_allowed: 0
  expected_rejection_is_case_pass_only_with_exact_code: true
