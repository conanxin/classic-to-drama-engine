business_outputs_allowed: false
requirement_groups:
  - requirement_group_id: "PT-01"
    required_behavior: "trusted active test-shadow key accepted by exact loader code and JWSCodec.verify"
    scenarios: [active_signature_accepted]
  - requirement_group_id: "PT-02"
    required_behavior: "unknown kid rejected"
    scenarios: [unknown_kid_rejected]
  - requirement_group_id: "PT-03"
    required_behavior: "revoked key rejected"
    scenarios: [revoked_key_rejected]
  - requirement_group_id: "PT-04"
    required_behavior: "expired status and validity-window expiry rejected"
    scenarios: [expired_status_rejected, expired_window_rejected]
  - requirement_group_id: "PT-05"
    required_behavior: "disabled key rejected"
    scenarios: [disabled_key_rejected]
  - requirement_group_id: "PT-06"
    required_behavior: "not-yet-valid key rejected"
    scenarios: [not_yet_valid_rejected]
  - requirement_group_id: "PT-07"
    required_behavior: "wrong algorithm or trust domain rejected"
    scenarios: [wrong_algorithm_rejected, wrong_domain_rejected]
  - requirement_group_id: "PT-08"
    required_behavior: "public material exact bytes or raw-key digest tamper rejected"
    scenarios: [material_noncanonical_tamper_rejected, raw_key_digest_tamper_rejected]
  - requirement_group_id: "PT-09"
    required_behavior: "status registry bytes or material-digest link tamper rejected"
    scenarios: [status_noncanonical_tamper_rejected, status_material_link_tamper_rejected]
  - requirement_group_id: "PT-10"
    required_behavior: "wrong trust identity, duplicate kid or unequal material/status key set rejected"
    scenarios: [wrong_trust_identity_rejected, duplicate_kid_rejected, key_set_mismatch_rejected]
  - requirement_group_id: "PT-11"
    required_behavior: "loader file, callable or input identity mismatch rejected"
    scenarios: [loader_input_identity_mismatch_rejected]
  - requirement_group_id: "PT-12"
    required_behavior: "each actual caller wrong or shared-codec binding mismatch rejected"
    scenarios: [caller_binding_mismatch_rejected]
  - requirement_group_id: "PT-13"
    required_behavior: "deterministic lookup and freeze identity reproducible across repeated loads"
    scenarios: [deterministic_lookup_reproducible]
  - requirement_group_id: "PT-14"
    required_behavior: "consumer cannot provide path, bytes, dict, store, environment or network trust input"
    scenarios: [consumer_input_prohibited]
  - requirement_group_id: "PT-15"
    required_behavior: "JWS artifact kid cannot embed or self-select untrusted public material"
    scenarios: [artifact_self_selected_key_rejected]
  - requirement_group_id: "PT-16"
    required_behavior: "test-only private seed excluded from runtime, public assets, evidence, aggregate and report"
    scenarios: [test_private_exclusion_proven]
  - requirement_group_id: "PT-17"
    required_behavior: "noncanonical JSON, duplicate key, unknown field, BOM, float and wrong profile rejected"
    scenarios: [noncanonical_json_rejected, duplicate_json_key_rejected, unknown_field_rejected, bom_rejected, float_rejected, wrong_profile_rejected]
  - requirement_group_id: "PT-18"
    required_behavior: "RangeBroker, BoundedReader and FormalLoader trust failures precede source, path or FD actions"
    scenarios: [trust_failure_precedes_side_effect]
  - requirement_group_id: "PT-19"
    required_behavior: "R2 canonical assets unchanged and Authorization V2 remains without signature, kid or public-key fields"
    scenarios: [r2_assets_unchanged]
  - requirement_group_id: "PT-20"
    required_behavior: "schemas, assets, loader, signing and six callers reproduce closure identities"
    scenarios: [closure_identities_reproduced]
  - requirement_group_id: "PT-21"
    required_behavior: "scope violation, unexpected file, unresolved dependency and other role-gap modifications are zero"
    scenarios: [scope_accounting_zero]
