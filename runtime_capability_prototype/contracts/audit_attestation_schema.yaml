$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:ctde:schema:prototype-audit-attestation:1"
oneOf:
  - type: "object"
    required:
      - "object_id"
      - "attestation_id"
      - "attestation_subtype"
      - "environment"
      - "attempt_id"
      - "authorization_file_sha256"
      - "iss"
      - "aud"
      - "iat"
      - "nbf"
      - "exp"
      - "actual_read_calls"
      - "actual_union_of_read_ranges"
      - "bytes_outside_allowed_ranges"
      - "model_invocations"
      - "raw_or_fixture_payload_persisted"
    properties:
      attestation_subtype: {const: "prototype_scope_execution_attestation"}
      environment: {const: "prototype_fixture_only"}
      candidate_run_id: {type: "null"}
      candidate_run_authorized: {const: false}
      raw_or_fixture_payload_persisted: {const: false}
  - type: "object"
    required:
      - "object_id"
      - "attestation_id"
      - "attestation_subtype"
      - "environment"
      - "attempt_id"
      - "authorization_file_sha256"
      - "iss"
      - "aud"
      - "iat"
      - "nbf"
      - "exp"
      - "scope_execution_attestation_sha256"
      - "business_output_status"
      - "business_output_sha256"
      - "formal_loader_check_status"
      - "raw_or_fixture_payload_persisted"
    properties:
      attestation_subtype: {const: "prototype_closure_audit_attestation"}
      environment: {const: "prototype_fixture_only"}
      candidate_run_id: {type: "null"}
      candidate_run_authorized: {const: false}
      business_output_status: {const: "absent"}
      business_output_sha256: {type: "null"}
      raw_or_fixture_payload_persisted: {const: false}

