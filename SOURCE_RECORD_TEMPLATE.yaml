# Field rules:
# - source_id: stable uppercase project ID defined in the approved source plan.
# - language: BCP 47 or ISO 639 compatible code, such as grc or en.
# - url: immutable retrieval URL for an acquired file; a discovery URL is not sufficient.
# - access_date: YYYY-MM-DD, recorded only when acquisition is executed.
# - license: SPDX identifier, NOASSERTION, or an approved LicenseRef-* value.
# - file_type: controlled lowercase value, such as tei_xml, cts_xml, txt, pdf, epub, or zip.
# - intended_usage: controlled role, such as canonical_anchor, primary_working_text,
#   or identity_metadata.
# - status: pending | acquired | verified | approved | blocked.
# - checksum: null while pending; after acquisition use sha256:<64 lowercase hex digits>.
