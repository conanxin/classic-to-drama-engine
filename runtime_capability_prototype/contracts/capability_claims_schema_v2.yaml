$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:ctde:schema:range-capability:2"
title: "CTDE Test-only Pending Capability V2"
type: object
additionalProperties: false
required: [schema_version, assurance_profile_id, capability_id, authorization_id, run_id, authorization_artifact_sha256, authorization_nonce, consumption_event_id, mint_claim_event_id, allowed_consumer, allowed_ranges, active]
properties:
  schema_version: {const: "2.0.0"}
  assurance_profile_id: {type: string}
  capability_id: {type: string}
  authorization_id: {type: string}
  run_id: {type: string}
  authorization_artifact_sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
  authorization_nonce: {type: string, pattern: "^[0-9a-f]{64}$"}
  consumption_event_id: {type: string}
  mint_claim_event_id: {type: string}
  allowed_consumer: {type: object}
  allowed_ranges: {type: array, minItems: 1, maxItems: 1}
  active: {const: false}
